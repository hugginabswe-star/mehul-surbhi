<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mehul & Dr. Surbhi — Wedding Invitation</title>
<meta name="description" content="Shri Shambhubhai Shivabhai Patel Family invites you to the wedding celebrations of Mehul & Dr. Surbhi, 29 January – 2 February 2027.">
<meta property="og:title" content="Mehul & Dr. Surbhi are getting married!">
<meta property="og:description" content="29 Jan – 2 Feb 2027 · Borsad & Surat · Please RSVP">
<meta property="og:image" content="img3/ganesha.webp">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600;700&family=Anek+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#1f2a2e; --soft:#5d6b70; --line:#ececec;
  --marigold:#f2a33a; --terra:#e2725b; --rose:#e98aa0; --sage:#7f9c7a; --sky:#6fa3c7; --butter:#f6d36b;
  --t-sage:#eef4ec; --t-butter:#fff8dc;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.gu{font-family:"Anek Gujarati","DM Sans",sans-serif;font-size:17px}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;position:relative}

/* soft floating colour blobs (scandi pastel) */
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(50px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:320px;height:320px;background:#fde2c4;top:-80px;left:-90px}
.blobs i:nth-child(2){width:280px;height:280px;background:#dbeadf;top:30%;right:-120px;animation-delay:-6s}
.blobs i:nth-child(3){width:300px;height:300px;background:#f9dbe2;bottom:-100px;left:-60px;animation-delay:-12s}
.blobs i:nth-child(4){width:220px;height:220px;background:#dceaf5;top:60%;left:40%;animation-delay:-3s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.1)}}

/* top controls */
.ctrl{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;left:10px;z-index:20;display:flex;justify-content:space-between;pointer-events:none}
.ctrl>*{pointer-events:auto}
.pillbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:99px;
  padding:7px 14px;font:500 13px "DM Sans",sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.06)}
body.gu .pillbtn{font-family:"Anek Gujarati",sans-serif;font-size:14px}
.lang{display:flex;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:99px;font:500 13px "DM Sans",sans-serif;color:var(--soft);cursor:pointer}
.lang button[data-l=gu]{font-family:"Anek Gujarati",sans-serif}
.lang button.on{background:var(--ink);color:#fff}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.bars b{width:3px;background:var(--terra);border-radius:2px;height:4px}
.music.on .bars b{animation:eq .9s ease-in-out infinite}
.music.on .bars b:nth-child(2){animation-delay:-.3s}.music.on .bars b:nth-child(3){animation-delay:-.6s}
.music:not(.on){animation:nudge 2.4s ease-in-out infinite}
@keyframes eq{50%{height:13px}}
@keyframes nudge{0%,80%,100%{transform:none}88%{transform:rotate(-4deg)}94%{transform:rotate(4deg)}}

/* hero */
.hero{text-align:center;padding:78px 0 30px}
.ganesha{width:120px;margin:0 auto}
.mantra{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
body.gu .mantra{letter-spacing:0;text-transform:none;font-size:15px}
.family{margin-top:26px;font-size:15px;color:var(--soft)}
.family b{display:block;color:var(--ink);font-size:17px;font-weight:700;margin:2px 0}
.names{font:400 clamp(58px,17vw,92px)/.95 Fraunces,serif;letter-spacing:-.02em;margin-top:22px}
.names em{display:block;font-style:italic}
.names .amp{display:block;font:700 .55em/1 Caveat,cursive;color:var(--marigold);margin:4px 0 -2px;transform:rotate(-6deg)}
body.gu .names{font:700 clamp(40px,12vw,58px)/1.15 "Anek Gujarati",sans-serif}
.married{display:inline-block;font:700 30px Caveat,cursive;color:var(--terra);transform:rotate(-3deg);margin-top:14px}
body.gu .married{font:600 22px "Anek Gujarati",sans-serif;transform:none}
.brideof{font-size:14px;color:var(--soft);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;text-decoration:none;transition:transform .2s}
.chip:hover{transform:translateY(-2px) rotate(-2deg)}
.count{display:flex;justify-content:center;gap:10px;margin-top:26px}
.count div{width:84px;padding:12px 0 10px;border-radius:20px;transform:rotate(var(--r))}
.count b{display:block;font:600 32px/1 Fraunces,serif}
.count span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
body.gu .count span{text-transform:none;letter-spacing:0;font-size:13px}

/* section heads */
.sh{text-align:center;margin:46px 0 18px}
.sh h2{font:400 34px/1.1 Fraunces,serif;letter-spacing:-.01em}
body.gu .sh h2{font:700 28px/1.3 "Anek Gujarati",sans-serif}
.sh p{font:700 22px Caveat,cursive;color:var(--sage);margin-top:2px}
body.gu .sh p{font:500 16px "Anek Gujarati",sans-serif}

/* event cards */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:30px;margin:0 0 22px;overflow:hidden;box-shadow:0 14px 40px rgba(31,42,46,.07)}
.card .head{position:relative;padding:26px 22px 22px;text-align:center}
.card .day-tag{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:#fff}
body.gu .card .day-tag{letter-spacing:0;text-transform:none;font-size:14px}
.card h3{font:400 30px/1.12 Fraunces,serif;margin-top:12px;letter-spacing:-.01em}
body.gu .card h3{font:700 25px/1.35 "Anek Gujarati",sans-serif}
.card .lead{font-size:15.5px;color:var(--soft);margin:8px auto 0;max-width:400px}
.card .art{width:96px;height:80px;object-fit:contain;margin:0 auto 6px;animation:wig 5s ease-in-out infinite}
.card .art.wide{width:180px;height:100px}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.list{padding:2px 22px 22px}
.dayline{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:18px 0 4px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.dayline::before,.dayline::after{content:"";flex:1;height:1px;background:var(--line)}
body.gu .dayline{letter-spacing:0;text-transform:none;font-size:14.5px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}
.ev:last-of-type{border-bottom:0}
.ev .ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center}
.ev .ic img{width:46px;height:46px;object-fit:contain;transition:transform .3s}
.ev:hover .ic img{transform:scale(1.15) rotate(-8deg)}
.ev .time{font-size:13px;font-weight:700;letter-spacing:.04em}
.ev .name{font:600 20px/1.2 Fraunces,serif}
body.gu .ev .name{font:700 18px/1.4 "Anek Gujarati",sans-serif}
.ev .sub{font-size:14.5px;color:var(--soft)}
.where{display:inline-flex;gap:5px;align-items:flex-start;margin-top:4px;font-size:14px;color:var(--ink);text-decoration:none;line-height:1.4}
.where svg{flex:none;width:13px;height:13px;margin-top:3px}
.where u{text-decoration:none;border-bottom:1px solid rgba(31,42,46,.25)}
.cal{display:inline-block;margin:6px 0 0;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--ink);background:#f3f3f0;border-radius:99px;padding:4px 11px}
.cal:hover{background:#e9e9e4}
.same{text-align:center;padding-top:10px;border-top:1px dashed var(--line)}
.hosts{font:400 22px/1.3 Fraunces,serif;margin-top:14px}
.hosts i{display:block;font:700 26px Caveat,cursive;color:var(--rose);margin:2px 0}
body.gu .hosts{font:700 19px/1.5 "Anek Gujarati",sans-serif}
.foot-art{display:block;width:100%}

/* tahuko */
.tahuko{position:relative;background:var(--t-butter);border-radius:30px;padding:30px 22px 26px;text-align:center;margin:40px 0 30px}
.tahuko::after{content:"";position:absolute;bottom:-16px;left:50%;margin-left:-16px;border:16px solid transparent;border-top-color:var(--t-butter);border-bottom:0}
.tahuko .peas{display:flex;justify-content:center;align-items:center;gap:10px}
.tahuko .peas img{width:70px;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.tahuko .peas img.r{transform:scaleX(-1);animation-name:bobr;animation-delay:-1.3s}
@keyframes bob{50%{transform:rotate(-7deg) translateY(-3px)}}
@keyframes bobr{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) rotate(-7deg) translateY(-3px)}}
.tahuko .tag{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:#fff;border-radius:99px;padding:5px 14px}
body.gu .tahuko .tag{letter-spacing:0;font-size:15px}
.tk1{font:700 38px/1.05 Caveat,cursive;color:var(--terra);margin-top:16px}
body.gu .tk1{font:700 24px/1.4 "Anek Gujarati",sans-serif}
.tk2{font-size:16px;margin-top:6px}
.wedo{display:inline-block;margin:12px 0 4px;font:700 46px/1 Caveat,cursive;color:var(--ink);background:linear-gradient(transparent 55%,var(--butter) 55%);padding:0 10px;animation:pop 1.8s ease-in-out infinite}
body.gu .wedo{font:700 30px "Anek Gujarati",sans-serif}
@keyframes pop{50%{transform:scale(1.08) rotate(-2deg)}}
.tk3{font-size:16px;color:var(--soft)}
.kids{margin-top:16px;font-size:14px;color:var(--soft)}
.kids b{display:block;font:700 32px/1.1 Caveat,cursive;color:var(--ink)}
body.gu .kids b{font:700 20px/1.5 "Anek Gujarati",sans-serif}

/* photos */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px}
.photos img:nth-child(3n+1){grid-column:span 2;aspect-ratio:3/2}

/* rsvp */
.rsvp{background:#fff;border:1px solid var(--line);border-radius:30px;padding:26px 20px;box-shadow:0 14px 40px rgba(31,42,46,.07)}
.rsvp .by{text-align:center;color:var(--soft);font-size:15px}
label{display:block;font-weight:700;font-size:14.5px;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fafaf8;font:inherit;font-size:16px;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--sky);background:#fff}
.choice{display:flex;gap:8px}
.choice label,.checks label{flex:1;margin:0;font-weight:500;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;gap:9px;align-items:center;cursor:pointer;background:#fff;font-size:15px}
.choice label:has(input:checked),.checks label:has(input:checked){border-color:var(--sage);background:var(--t-sage)}
.checks{display:grid;gap:8px}
.choice input,.checks input{accent-color:var(--sage);width:18px;height:18px;flex:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px;cursor:pointer;color:var(--ink)}
.stepper input{width:80px;text-align:center;font-weight:700;font-size:18px}
button.go{margin-top:24px;width:100%;padding:16px;border:0;border-radius:99px;background:var(--ink);color:#fff;font:700 16px "DM Sans",sans-serif;letter-spacing:.04em;cursor:pointer;transition:transform .2s,background .2s}
button.go:hover{background:var(--terra);transform:translateY(-2px)}
body.gu button.go{font-family:"Anek Gujarati",sans-serif;font-size:17px}
button.go:disabled{opacity:.6}
.wa{display:block;text-align:center;margin-top:12px;color:var(--sage);font-weight:700}
.done{text-align:center;padding:16px 0}
.done b{display:block;font:700 48px Caveat,cursive;color:var(--terra)}
body.gu .done b{font:700 28px "Anek Gujarati",sans-serif}
.err{color:var(--terra);font-size:14.5px;margin-top:10px;text-align:center}
footer{text-align:center;padding:36px 16px 60px;color:var(--soft);font-size:15px}
footer .sig{font:700 40px Caveat,cursive;color:var(--ink);margin-top:2px}
.hidden{display:none!important}

.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.blobs i,.card .art,.tahuko .peas img,.wedo,.music .bars b,.music{animation:none!important}#fx{display:none}}
@media (max-width:380px){.ev{grid-template-columns:52px 1fr;gap:11px}.ev .ic{width:52px;height:52px;border-radius:16px}.ev .ic img{width:38px;height:38px}.count div{width:76px}}
</style>
</head>
<body>
<div class="blobs"><i></i><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>

<div class="ctrl">
  <button class="pillbtn music" id="music" aria-label="Music on/off"><span class="bars"><b></b><b></b><b></b></span><span id="mLabel">♪</span></button>
  <div class="pillbtn lang" role="group" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="gu">ગુજરાતી</button></div>
</div>
<audio id="audio" loop preload="auto"></audio>

<main class="wrap">
  <header class="hero">
    <img class="ganesha" src="img3/ganesha.webp" alt="Shree Ganesh">
    <div class="mantra" data-i="mantra"></div>
    <p class="family"><span data-i="lead"></span><b data-i="family"></b><span data-i="invites"></span></p>
    <h1 class="names" id="names"></h1>
    <div class="married" data-i="married"></div>
    <p class="brideof" data-i="brideOf"></p>

    <div class="count" id="count"></div>
  </header>

  <div class="sh rv"><h2 data-i="events"></h2><p data-i="eventsSub"></p></div>
  <div id="cards"></div>

  <section class="tahuko rv">
    <div class="peas"><img src="img3/peacock.webp" alt=""><span class="tag" data-i="tahuko"></span><img class="r" src="img3/peacock.webp" alt=""></div>
    <p class="tk1" data-i="tk1"></p>
    <p class="tk2" data-i="tk2"></p>
    <span class="wedo" data-i="wedo"></span>
    <p class="tk3" data-i="tk3"></p>
    <p class="kids"><span data-i="tkFrom"></span><b data-i="tkKids"></b></p>
  </section>

  <section id="photoSec" class="hidden">
    <div class="sh rv"><h2 data-i="photosH"></h2><p data-i="photosSub"></p></div>
    <div class="photos rv" id="photos"></div>
  </section>

  <div class="sh rv"><h2 data-i="rsvpH"></h2><p data-i="rsvpSub"></p></div>
  <section class="rsvp rv" id="rsvp">
    <p class="by" id="rsvpBy"></p>
    <form id="form" novalidate>
      <label for="f-name" data-i="fName"></label>
      <input id="f-name" name="name" type="text" required autocomplete="name">
      <label for="f-phone" data-i="fPhone"></label>
      <input id="f-phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel">
      <label data-i="fAttend"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="Yes" checked><span data-i="yes"></span></label>
        <label><input type="radio" name="attending" value="No"><span data-i="no"></span></label>
      </div>
      <div id="yesOnly">
        <label for="f-count" data-i="fCount"></label>
        <div class="stepper"><button type="button" data-s="-1" aria-label="minus">−</button><input id="f-count" name="guests" type="number" min="1" max="30" value="2"><button type="button" data-s="1" aria-label="plus">+</button></div>
        <label data-i="fEvents"></label>
        <div class="checks" id="checks"></div>
      </div>
      <label for="f-msg" data-i="fMsg"></label>
      <textarea id="f-msg" name="message" rows="3"></textarea>
      <button class="go" type="submit" data-i="send"></button>
      <p class="err hidden" id="err"></p>
    </form>
    <div class="done hidden" id="done"><b data-i="thanks"></b><span data-i="thanksSub"></span></div>
    <a class="wa hidden" id="wa" target="_blank" rel="noopener" data-i="wa"></a>
  </section>
</main>

<footer>
  <p data-i="footer"></p>
  <p class="sig">Mehul &amp; Surbhi</p>
</footer>

<script>

};
/* [accent, tint, readable text colour] */
const COL = { marigold:["#f2a33a","#fff4e2","#a8620a"], rose:["#e98aa0","#fdeef1","#b8506a"], sage:["#7f9c7a","#eef4ec","#56724f"], terra:["#e2725b","#fdefeb","#b84e38"] };

const EVENTS = {
  1: { c:"marigold", art:"kalash", tag:{en:"29 – 30 Jan · Borsad",gu:"૨૯ – ૩૦ જાન્યુ. · બોરસદ"},
       title:{en:"Pre-Wedding Celebrations",gu:"પૂર્વ વૈવાહિક પ્રસંગો"},
       lead:{en:"Prayers, music, dancing and a lot of haldi — come celebrate with us!",gu:"પૂજા, સંગીત, ગરબા અને હલદીની મોજ — અમારી સાથે ઉજવણીમાં જોડાવ!"},
       days:[

/* Which functions this guest is invited to: ?e=134 (default). 2 = parents' vows renewal, special guests only. */
const params = new URLSearchParams(location.search);
let invited = (params.get("e") || "134").split("").filter(k => EVENTS[k]);
if (!invited.length) invited = ["1","3","4"];
invited = [...new Set(invited)].sort();

let lang = "en";
try { if (localStorage.getItem("lang") === "gu") lang = "gu"; } catch(e){}
if (params.get("lang") === "gu") lang = "gu";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PIN = c => `<svg viewBox="0 0 24 24" fill="${c}"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>`;
const where = (p, c) => `<a class="where" href="${MAP(PLACES[p].q)}" target="_blank" rel="noopener">${PIN(c)}<span><u>${esc(PLACES[p][lang])}</u></span></a>`;

function cal(at, title, p){
  const s = new Date(at + ":00+05:30"), e = new Date(s.getTime() + 2*36e5);
  const f = x => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mehul-Surbhi//EN","BEGIN:VEVENT","UID:" + f(s) + "@mehul-surbhi",
    "DTSTAMP:" + f(new Date()),"DTSTART:" + f(s),"DTEND:" + f(e),"SUMMARY:" + title + " – Mehul & Surbhi","LOCATION:" + PLACES[p].en.replace(/,/g, "\\,"),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  return `<a class="cal" download="${title.replace(/[^A-Za-z]+/g, "-")}.ics" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}">＋ ${esc(T[lang].cal)}</a>`;
}

function renderCards(){
  const L = lang;
  document.getElementById("chips").innerHTML = invited.map(k => { const [, t, tx] = COL[EVENTS[k].c];
    return `<a class="chip" href="#ev${k}" style="background:${t};color:${tx}">${esc(EVENTS[k].title[L])}</a>`; }).join("");
  document.getElementById("cards").innerHTML = invited.map(k => {
    const e = EVENTS[k], [c, tint, tx] = COL[e.c];
    const days = e.days.map(d => {
      const one = d.items.length > 1 && d.items.every(i => i.p === d.items[0].p);
      return `<div class="dayline">${esc(DAYS[d.d][L])}</div>` + d.items.map(i => `<div class="ev">
          <div class="ic" style="background:${tint}"><img src="img3/${i.ic}.webp" alt=""></div>
          <div><div class="time" style="color:${tx}">${esc(i.t[L])}</div>
            <div class="name">${esc(i.n[L])}</div>${i.s ? `<div class="sub">${esc(i.s[L])}</div>` : ""}
            ${one ? "" : where(i.p, c) + "<br>"}${cal(i.at, i.n.en, i.p)}</div></div>`).join("")
        + (one ? `<div class="same">${where(d.items[0].p, c)}</div>` : "");
    }).join("");
    return `<section class="card rv" id="ev${k}">
      <div class="head" style="background:${tint}">
        <img class="art${e.wide ? " wide" : ""}" src="img3/${e.art}.webp" alt="">
        <span class="day-tag" style="color:${tx}">${esc(e.tag[L])}</span>
        <h3>${esc(e.title[L])}</h3>
        <p class="lead">${esc(e.lead[L])}</p>
        ${e.hosts ? `<p class="hosts">${esc(e.hosts[L][0])}<i>&amp;</i>${esc(e.hosts[L][1])}</p><p class="lead">${esc(e.invite[L])}</p>` : ""}
      </div>
      <div class="list">${days}</div>
      ${e.foot ? `<img class="foot-art" src="img3/${e.foot}.webp" alt="">` : ""}
    </section>`;
  }).join("");
  document.getElementById("checks").innerHTML = invited.map(k =>
    `<label><input type="checkbox" name="events" value="${esc(EVENTS[k].title.en)}" checked><span>${esc(EVENTS[k].title[L])}</span></label>`).join("");
  reveal();
}

function renderText(){
  document.body.classList.toggle("gu", lang === "gu");
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const v = T[lang][el.dataset.i]; if (v !== undefined) el.textContent = v; });
  document.getElementById("names").innerHTML = lang === "gu"
    ? `ચિ. મેહુલ<span class="amp">&amp;</span>ડૉ. સુરભી`
    : `Mehul<span class="amp">&amp;</span><em>Surbhi</em>`;
  document.getElementById("rsvpBy").textContent = RSVP_BY[lang];
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  setMusicLabel(); renderCards(); renderPhotos(); tick(); setWa();
}

function renderPhotos(){
  const sec = document.getElementById("photoSec");
  if (!PHOTOS.length) { sec.classList.add("hidden"); return; }
  sec.classList.remove("hidden");
  document.getElementById("photos").innerHTML = PHOTOS.map(p => `<img src="${esc(p)}" alt="" loading="lazy">`).join("");
}

function tick(){
  const ms = WEDDING - Date.now(), c = document.getElementById("count");
  if (ms <= 0) { c.innerHTML = ""; return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
  const st = [["#fff4e2","-3deg"],["#eef4ec","2deg"],["#fdeef1","-2deg"]];
  c.innerHTML = [[d,"d"],[h,"h"],[m,"m"]].map(([v,k],i) => `<div style="background:${st[i][0]};--r:${st[i][1]}"><b>${v}</b><span>${T[lang][k]}</span></div>`).join("");
}
setInterval(tick, 30000);

let io;
function reveal(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window) || params.has("static")) { els.forEach(e => e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .08 });
  els.forEach(e => io.observe(e));
}

function setWa(){
  const a = document.getElementById("wa");
  if (!RSVP_WHATSAPP) { a.classList.add("hidden"); return; }
  a.classList.remove("hidden");
  a.href = `https://wa.me/${RSVP_WHATSAPP}?text=` + encodeURIComponent("RSVP – Mehul & Surbhi wedding: ");
}

/* ---- music: phones block sound until the first tap, so it starts on the guest's first tap anywhere ---- */
const audio = document.getElementById("audio"), mBtn = document.getElementById("music");
let wantMusic = true;
function setMusicLabel(){ document.getElementById("mLabel").textContent = audio.paused ? T[lang].musicTap : T[lang].music; }
audio.src = MUSIC_FILE; audio.volume = .5;
function play(){ audio.play().then(() => { mBtn.classList.add("on"); setMusicLabel(); }).catch(() => {}); }
function pause(){ audio.pause(); mBtn.classList.remove("on"); setMusicLabel(); }
mBtn.onclick = ev => { ev.stopPropagation(); if (audio.paused) { wantMusic = true; play(); } else { wantMusic = false; pause(); } };
play();   // plays straight away where the browser allows it
const firstTap = () => { if (wantMusic && audio.paused) play(); ["pointerup","touchend","keydown"].forEach(t => removeEventListener(t, firstTap)); };
["pointerup","touchend","keydown"].forEach(t => addEventListener(t, firstTap, { passive: true }));
document.addEventListener("visibilitychange", () => { if (document.hidden && !audio.paused) { audio.pause(); audio.dataset.resume = 1; }
  else if (!document.hidden && audio.dataset.resume) { delete audio.dataset.resume; play(); } });

/* ---- pastel confetti: a happy burst on arrival + after RSVP, then a gentle drift ---- */
const cv = document.getElementById("fx"), cx = cv.getContext("2d");
const COLS = ["#f2a33a","#e2725b","#e98aa0","#7f9c7a","#6fa3c7","#f6d36b"];
let P = [], dpr = Math.min(2, devicePixelRatio || 1), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; } size(); addEventListener("resize", size);
const bit = b => ({ x: b ? innerWidth*(.2 + Math.random()*.6) : Math.random()*innerWidth, y: b ? innerHeight*.35 : -20,
  vx: b ? (Math.random()-.5)*10 : 0, vy: b ? -Math.random()*10-3 : Math.random()*.6+.45, s: Math.random()*5+4, a: Math.random()*6.28,
  va: (Math.random()-.5)*.12, c: COLS[Math.random()*COLS.length|0], shape: Math.random()*3|0, w: Math.random()*6.28, b });
function burst(n){ if (!still) for (let i=0;i<n;i++) P.push(bit(true)); }
let last = 0;
function frame(t){
  if (P.filter(p => !p.b).length < 10 && t - last > 1100) { P.push(bit(false)); last = t; }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  P = P.filter(p => p.y < innerHeight + 30);
  for (const p of P) {
    if (p.b) { p.vy += .25; p.vx *= .985; } else { p.w += .02; p.vx = Math.sin(p.w)*.5; }
    p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.scale(1, Math.abs(Math.sin(p.a*1.4))*.7+.3);
    cx.fillStyle = p.c; cx.globalAlpha = .9; cx.beginPath();
    if (p.shape === 0) cx.arc(0,0,p.s*.6,0,6.28); else if (p.shape === 1) cx.rect(-p.s*.6,-p.s*.3,p.s*1.2,p.s*.6); else cx.ellipse(0,0,p.s,p.s*.5,0,0,6.28);
    cx.fill(); cx.restore();
  }
  requestAnimationFrame(frame);
}
if (!still) { requestAnimationFrame(frame); setTimeout(() => burst(70), 600); }

document.querySelectorAll(".lang button").forEach(b => b.onclick = ev => {
  ev.stopPropagation(); lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch(e){} renderText();
});
document.querySelectorAll("input[name=attending]").forEach(r => r.onchange = () =>
  document.getElementById("yesOnly").classList.toggle("hidden", r.value === "No" && r.checked));
document.querySelectorAll(".stepper button").forEach(b => b.onclick = () => {
  const i = document.getElementById("f-count"); i.value = Math.min(30, Math.max(1, (+i.value || 1) + +b.dataset.s)); });

document.getElementById("form").onsubmit = async ev => {
  ev.preventDefault();
  const f = ev.target, err = document.getElementById("err"), btn = f.querySelector("button.go");
  const data = {
    name: f.elements["name"].value.trim(), phone: f.elements["phone"].value.trim(),
    attending: f.elements["attending"].value, guests: f.elements["attending"].value === "Yes" ? f.elements["guests"].value : "0",
    events: [...f.querySelectorAll("input[name=events]:checked")].map(x => x.value).join(", "),
    message: f.elements["message"].value.trim(), invite: invited.join(""), lang
  };
  err.classList.add("hidden");
  if (!data.name || !data.phone) { err.textContent = T[lang].need; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = T[lang].sending;
  try {
    if (!RSVP_ENDPOINT) throw new Error("no endpoint");
    await fetch(RSVP_ENDPOINT, { method:"POST", mode:"no-cors", body: new URLSearchParams(data) });
    f.classList.add("hidden"); document.getElementById("done").classList.remove("hidden"); burst(130);
  } catch (e) {
    err.textContent = T[lang].fail; err.classList.remove("hidden");
    btn.disabled = false; btn.textContent = T[lang].send;
  }
};

renderText();
