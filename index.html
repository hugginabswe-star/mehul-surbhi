<style>
:root{
  --ivory:#fbf8f1; --paper:#fffdf8; --gold:#b08a3e; --gold-l:#d9bd7a; --maroon:#7a1f1f;
  --ink:#4a3423; --muted:#8a7258; --line:#e6d6b0; --green:#5f7a4a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.gu{font-family:"Noto Serif Gujarati","Cormorant Garamond",serif;font-size:17px}
img{max-width:100%;display:block}
.art{}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* language switch */
.lang{position:fixed;top:12px;right:12px;z-index:10;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;overflow:hidden;box-shadow:0 2px 10px rgba(122,90,40,.12)}
.lang button{border:0;background:none;padding:7px 14px;font:600 14px "Cormorant Garamond",serif;color:var(--muted);cursor:pointer}
.lang button[data-l=gu]{font-family:"Noto Serif Gujarati",serif;font-size:13px}
.lang button.on{background:var(--gold);color:#fff}

/* hero */
.hero{position:relative;text-align:center;padding:56px 0 40px;overflow:hidden}
.floral{position:absolute;top:0;left:0;width:130px;opacity:.95}
.floral.r{left:auto;right:0;transform:scaleX(-1)}
.ganesha{width:84px;margin:0 auto 6px}
.mantra{color:var(--gold);font-style:italic;font-size:15px;letter-spacing:.04em}
.lead{margin-top:22px;font-size:17px;color:var(--muted)}
.family{margin-top:6px;font-weight:700;color:var(--maroon);font-size:21px;letter-spacing:.06em;text-transform:uppercase}
body.gu .family{text-transform:none;letter-spacing:0;font-size:20px}
.couple{font-family:"Great Vibes",cursive;color:var(--gold);font-size:64px;line-height:1.1;margin-top:18px}
.couple .w{display:block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:var(--muted);margin:2px 0}
body.gu .couple{font-family:"Noto Serif Gujarati",serif;font-weight:700;font-size:40px;color:var(--maroon)}
body.gu .couple .w{font-family:"Noto Serif Gujarati",serif;font-style:normal;font-size:18px}
.bride-of{font-size:16px;color:var(--muted);margin-top:6px}
.dates{display:inline-block;margin-top:22px;padding:8px 22px;border:1px solid var(--gold-l);border-radius:99px;color:var(--maroon);font-weight:600;letter-spacing:.08em}
.divider{width:180px;height:14px;margin:26px auto;background:
  radial-gradient(circle,var(--gold) 3px,transparent 3.5px) center/14px 14px no-repeat,
  linear-gradient(var(--gold-l),var(--gold-l)) center/100% 1px no-repeat}
.count{display:flex;justify-content:center;gap:14px;margin-top:6px}
.count div{min-width:62px}
.count b{display:block;font-size:30px;color:var(--maroon);line-height:1}
.count span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* event cards */
section h2{text-align:center;color:var(--maroon);font-size:26px;letter-spacing:.05em;margin:8px 0 18px}
body.gu section h2{font-size:22px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:160px 160px 14px 14px;padding:46px 24px 22px;margin:0 0 26px;text-align:center;box-shadow:0 6px 24px rgba(122,90,40,.08);overflow:hidden}
.card::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold-l);border-radius:154px 154px 9px 9px;pointer-events:none}
.card .tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--maroon);border-radius:99px;padding:3px 12px;margin-bottom:10px}
body.gu .card .tag{letter-spacing:0;text-transform:none}
.card h3{font-size:28px;line-height:1.15;color:var(--maroon);font-weight:600;letter-spacing:.03em}
body.gu .card h3{font-size:24px}
.card .intro{font-style:italic;color:var(--muted);font-size:17px;margin:8px auto 0;max-width:420px}
body.gu .card .intro{font-style:normal;font-size:15px}
.card .hosts{margin-top:10px;font-weight:600;font-size:19px}
.day{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:15px}
body.gu .day{letter-spacing:0;text-transform:none;font-size:15px}
.row{display:grid;grid-template-columns:88px 1fr;gap:10px;text-align:left;padding:9px 0;align-items:start}
.row .t{font-weight:700;color:var(--maroon);font-size:16px;padding-top:2px}
.row .n{font-weight:600;font-size:18px;line-height:1.25}
body.gu .row .n{font-size:16px}
.row a{display:inline-block;margin-top:3px;font-size:15px;color:var(--green);text-decoration:none;border-bottom:1px dotted var(--green)}
.row a::before{content:"⌖ "}
.card .pic{margin:16px -24px -22px;}
.card .addr{font-size:15px;color:var(--muted)}

/* rsvp */
.rsvp{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 20px;margin:10px 0 30px;box-shadow:0 6px 24px rgba(122,90,40,.08)}
.rsvp p.sub{text-align:center;color:var(--muted);font-size:16px;margin:-8px 0 18px}
label{display:block;font-weight:600;font-size:16px;margin:14px 0 5px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:17px;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--gold-l);border-color:var(--gold)}
.choice{display:flex;gap:10px}
.choice label,.checks label{flex:1;margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;background:#fff}
.checks{display:grid;gap:8px}
.choice input,.checks input{accent-color:var(--maroon);width:18px;height:18px}
button.go{margin-top:20px;width:100%;padding:14px;border:0;border-radius:99px;background:var(--maroon);color:#fff;font:700 18px "Cormorant Garamond",serif;letter-spacing:.1em;cursor:pointer}
body.gu button.go{font-family:"Noto Serif Gujarati",serif;letter-spacing:0;font-size:16px}
button.go:disabled{opacity:.6}
.wa{display:block;text-align:center;margin-top:12px;color:var(--green);font-size:16px}
.done{text-align:center;padding:20px 0}
.done b{display:block;font-size:26px;color:var(--maroon)}
.err{color:var(--maroon);font-size:15px;margin-top:10px;text-align:center}
footer{text-align:center;padding:10px 0 50px;color:var(--muted);font-size:15px}
footer .couple{font-size:40px;margin:0}
.hidden{display:none!important}
@media (max-width:420px){.couple{font-size:52px}.card{border-radius:120px 120px 14px 14px}.card::before{border-radius:114px 114px 9px 9px}.row{grid-template-columns:76px 1fr}}
</style>
</head>

    <p class="family" data-i="family"></p>
    <p class="lead" data-i="invites"></p>

    <div class="dates" data-i="dates"></div>
    <div class="divider"></div>
    <div class="count" id="count"></div>
  </div>
</header>

<main class="wrap">
  <section>
    <h2 data-i="events"></h2>
    <div id="cards"></div>
  </section>

  <section class="rsvp" id="rsvp">
    <h2 data-i="rsvpH"></h2>
    <p class="sub" data-i="rsvpSub"></p>
    <form id="form" novalidate>
      <label for="f-name" data-i="fName"></label>
      <input id="f-name" name="name" type="text" required autocomplete="name">
      <label for="f-phone" data-i="fPhone"></label>
      <input id="f-phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel">
      <label data-i="fAttend"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="Yes" checked><span data-i="yes"></span></label>
        <label><input type="radio" name="attending" value="No"><span data-i="no"></span></label>
      </div>
      <div id="yesOnly">
        <label for="f-count" data-i="fCount"></label>
        <input id="f-count" name="guests" type="number" min="1" max="30" value="2">
        <label data-i="fEvents"></label>
        <div class="checks" id="checks"></div>
      </div>
      <label for="f-msg" data-i="fMsg"></label>
      <textarea id="f-msg" name="message" rows="3"></textarea>
      <button class="go" type="submit" data-i="send"></button>
      <p class="err hidden" id="err"></p>
    </form>
    <div class="done hidden" id="done"><b data-i="thanks"></b><span data-i="thanksSub"></span></div>
    <a class="wa hidden" id="wa" target="_blank" rel="noopener" data-i="wa"></a>
  </section>
</main>

<footer>
  <div class="divider"></div>
  <p data-i="footer"></p>
  <p class="couple">Mehul &amp; Surbhi</p>
</footer>

       send:"જવાબ મોકલો", sending:"મોકલાઈ રહ્યું છે…", thanks:"આભાર!", thanksSub:"આપનો જવાબ પટેલ પરિવારને મળી ગયો છે.",
       wa:"અથવા WhatsApp પર જવાબ આપો", need:"કૃપા કરી નામ અને મોબાઈલ નંબર લખો.", fail:"મોકલી શકાયું નહીં. ફરી પ્રયાસ કરો અથવા WhatsApp પર જવાબ આપો.",
       footer:"પટેલ પરિવાર તરફથી સ્નેહ અને શુભેચ્છાઓ સહ" }
};

/* Which functions this guest is invited to: ?e=134 (default 134). 2 = parents' vows renewal, special guests only. */
const params = new URLSearchParams(location.search);
let invited = (params.get("e") || "134").split("").filter(k => EVENTS[k]);
if (!invited.length) invited = ["1","3","4"];
invited = [...new Set(invited)].sort();

let lang = "en";
try { if (localStorage.getItem("lang") === "gu") lang = "gu"; } catch(e){}
if (params.get("lang") === "gu") lang = "gu";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderCards(){
  const L = lang;
  document.getElementById("cards").innerHTML = invited.map(k => {
    const e = EVENTS[k];
    return `<article class="card">
      <span class="tag">${esc(e.tag[L])}</span>
      <h3>${esc(e.title[L])}</h3>
      ${e.hosts ? `<p class="hosts">${esc(e.hosts[L])}</p>` : ""}
      ${e.intro ? `<p class="intro">${esc(e.intro[L])}</p>` : ""}
      ${e.days.map(d => `<div class="day">${esc(d.d[L])}</div>` + d.items.map(i => `
        <div class="row"><div class="t">${esc(i.t[L])}</div>
          <div><div class="n">${esc(i.n[L])}</div>
          <a href="${MAP(PLACES[i.p].q)}" target="_blank" rel="noopener">${esc(PLACES[i.p][L])}</a></div></div>`).join("")).join("")}
      ${e.pic ? `<img class="pic art" src="img/${e.pic}.png" alt="">` : ""}
    </article>`;
  }).join("");
  document.getElementById("checks").innerHTML = invited.map(k =>
    `<label><input type="checkbox" name="events" value="${esc(EVENTS[k].title.en)}" checked><span>${esc(EVENTS[k].title[L])}</span></label>`).join("");
}

function renderText(){
  document.body.classList.toggle("gu", lang === "gu");
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const v = T[lang][el.dataset.i]; if (v !== undefined) el.textContent = v; });
  document.querySelector(".rsvp .sub").textContent = RSVP_BY[lang];
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  renderCards(); tick(); setWa();
}

function tick(){
  const ms = WEDDING - Date.now(), c = document.getElementById("count");
  if (ms <= 0) { c.innerHTML = ""; return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
  c.innerHTML = [[d,"d"],[h,"h"],[m,"m"]].map(([v,k]) => `<div><b>${v}</b><span>${T[lang][k]}</span></div>`).join("");
}
setInterval(tick, 30000);

function setWa(){
  const a = document.getElementById("wa");
  if (!RSVP_WHATSAPP) { a.classList.add("hidden"); return; }
  a.classList.remove("hidden");
  a.href = `https://wa.me/${RSVP_WHATSAPP}?text=` + encodeURIComponent("RSVP – Mehul & Surbhi wedding: ");
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch(e){} renderText();
});
document.querySelectorAll("input[name=attending]").forEach(r => r.onchange = () =>
  document.getElementById("yesOnly").classList.toggle("hidden", r.value === "No" && r.checked));

document.getElementById("form").onsubmit = async ev => {
  ev.preventDefault();
  const f = ev.target, err = document.getElementById("err"), btn = f.querySelector("button");
  const data = {
    name: f.elements["name"].value.trim(), phone: f.elements["phone"].value.trim(),
    attending: f.elements["attending"].value, guests: f.elements["attending"].value === "Yes" ? f.elements["guests"].value : "0",
    events: [...f.querySelectorAll("input[name=events]:checked")].map(x => x.value).join(", "),
    message: f.elements["message"].value.trim(), invite: invited.join(""), lang
  };
  err.classList.add("hidden");
  if (!data.name || !data.phone) { err.textContent = T[lang].need; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = T[lang].sending;
  try {
    if (!RSVP_ENDPOINT) throw new Error("no endpoint");
    await fetch(RSVP_ENDPOINT, { method:"POST", mode:"no-cors", body: new URLSearchParams(data) });
    f.classList.add("hidden"); document.getElementById("done").classList.remove("hidden");
  } catch (e) {
    err.textContent = T[lang].fail; err.classList.remove("hidden");
    btn.disabled = false; btn.textContent = T[lang].send;
  }
};


/* music plays by default; phones block sound until the first touch, so it also starts on the first tap/scroll-tap anywhere */
const bgm=document.getElementById("bgm"); bgm.src=MUSIC_FILE; bgm.volume=.7;
bgm.play().catch(()=>{});
const evs=["pointerdown","pointerup","touchstart","touchend","click","keydown"];
const first=()=>{ bgm.play().then(()=>evs.forEach(t=>removeEventListener(t,first,true))).catch(()=>{}); };
evs.forEach(t=>addEventListener(t,first,true));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) bgm.pause(); else bgm.play().catch(()=>{}); });
renderText();
</script>
</body>
</html>
