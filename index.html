<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mehul & Dr. Surbhi — Wedding Invitation</title>
<meta name="description" content="Shri Shambhubhai Shivabhai Patel Family invites you to the wedding celebrations of Mehul & Dr. Surbhi, 29 January – 2 February 2027.">
<meta property="og:title" content="Mehul & Dr. Surbhi — Wedding Invitation">
<meta property="og:description" content="29 Jan – 2 Feb 2027 · Borsad & Surat · Please RSVP">
<meta property="og:image" content="img3/ganesha.webp">
<meta name="theme-color" content="#fbf5eb">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=EB+Garamond:wght@400;500;600&family=Great+Vibes&family=Noto+Serif+Gujarati:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf5eb; --card:#fdf9f1; --gold:#c9a24b; --gold-d:#a8802e; --gold-l:#e6cf95;
  --brown:#5a2a17; --maroon:#7b1e1e; --ink:#3f2a1c; --muted:#7d6450; --olive:#55692b; --olive-d:#3f4f1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--paper) radial-gradient(ellipse at 50% 0,#fffdf8 0,var(--paper) 60%) fixed;color:var(--ink);
  font-family:"EB Garamond",Georgia,serif;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.gu{font-family:"Noto Serif Gujarati","EB Garamond",serif;font-size:16px;line-height:1.65}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- cover ---------- */
.cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;perspective:1600px;transition:visibility 0s 1.6s}
.cover.gone{visibility:hidden;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.5%;background:var(--paper) radial-gradient(ellipse at 100% 45%,#fffdf8 0,var(--paper) 75%);
  transition:transform 1.4s cubic-bezier(.7,0,.3,1);box-shadow:inset 0 0 0 10px var(--paper),inset 0 0 0 11.5px var(--gold-l),inset 0 0 0 16px var(--paper),inset 0 0 0 17px var(--gold-l)}
.door.l{left:0;transform-origin:0 50%}
.door.r{right:0;transform-origin:100% 50%;background:var(--paper) radial-gradient(ellipse at 0 45%,#fffdf8 0,var(--paper) 75%)}
.cover.gone .door.l{transform:rotateY(-105deg)}
.cover.gone .door.r{transform:rotateY(105deg)}
.c-in{position:relative;z-index:2;transition:opacity .6s,transform .8s}
.cover.gone .c-in{opacity:0;transform:scale(1.15)}
.cover .c-corner{position:absolute;width:84%;max-width:230px;top:0;left:0}
.cover .c-corner.r{left:auto;right:0;transform:scaleX(-1)}
.cover .c-corner.b{top:auto;bottom:0;transform:scaleY(-1)}
.cover .g{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.cover .c-corner.b.r{transform:scale(-1,-1)}
.cover .g{width:200px;margin:0 auto 8px}
.cover .names{font-family:"Great Vibes",cursive;color:var(--gold-d);font-size:58px;line-height:1.05}
.cover .names i{display:block;font:italic 500 22px "Cormorant Garamond",serif;color:var(--muted)}
.cover .when{font-family:Cinzel,serif;letter-spacing:.22em;color:var(--brown);font-size:13px;margin-top:14px}
.open{margin-top:30px;border:1px solid var(--gold);background:linear-gradient(#fffaf0,#f6ead0);color:var(--brown);
  font:600 15px Cinzel,serif;letter-spacing:.2em;padding:13px 30px;border-radius:99px;cursor:pointer;
  box-shadow:0 0 0 4px rgba(201,162,75,.15),0 8px 22px rgba(120,80,20,.15);animation:pulse 2.4s ease-in-out infinite}
body.gu .open{font:700 16px "Noto Serif Gujarati",serif;letter-spacing:0}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(201,162,75,.05),0 8px 22px rgba(120,80,20,.15)}}

/* ---------- floating controls ---------- */
.ctrl{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;display:flex;gap:8px}
.lang{display:flex;background:rgba(253,249,241,.92);border:1px solid var(--gold-l);border-radius:99px;overflow:hidden;backdrop-filter:blur(6px)}
.lang button{border:0;background:none;padding:7px 13px;font:600 13px "EB Garamond",serif;color:var(--muted);cursor:pointer}
.lang button[data-l=gu]{font-family:"Noto Serif Gujarati",serif;font-size:12px}
.lang button.on{background:var(--olive);color:#fff}
.music{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold-l);background:rgba(253,249,241,.92);color:var(--gold-d);
  cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.music svg{width:18px;height:18px}
.music.on svg{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- the arched card ---------- */
.card{position:relative;margin:22px 0 30px;padding:14px;background:var(--card);
  border:1.5px solid var(--gold-l);box-shadow:0 10px 40px rgba(110,75,25,.09)}
.card::after{content:"";position:absolute;inset:5px;border:1px solid var(--gold-l);pointer-events:none}
.arch{position:relative;border:1.5px solid var(--gold);border-radius:260px 260px 4px 4px / 150px 150px 4px 4px;
  padding:58px 18px 26px;text-align:center;overflow:hidden}
.arch::before{content:"";position:absolute;inset:6px;border:1px solid var(--gold-l);
  border-radius:254px 254px 2px 2px / 145px 145px 2px 2px;pointer-events:none}
.corner{position:absolute;width:38%;max-width:200px;top:-6px;left:-6px;z-index:2;pointer-events:none}
.corner.r{left:auto;right:-6px;transform:scaleX(-1)}
.corner.b{top:auto;bottom:-6px;width:32%;max-width:170px;transform:none}
.corner.b.r{transform:scaleX(-1)}
.bells{position:absolute;top:0;width:44px;z-index:1;transform-origin:50% 0;animation:sway 3.6s ease-in-out infinite}
.bells.l{left:19%}.bells.r{right:19%;animation-delay:-1.8s}
@keyframes sway{0%,100%{transform:rotate(2.5deg)}50%{transform:rotate(-2.5deg)}}
.top-art{margin:-30px auto 4px;width:62%;max-width:250px}
.top-art.sm{width:40%;max-width:150px;margin-top:-26px}
.bottom-art{margin:18px -18px -26px;width:calc(100% + 36px);max-width:none}

.mantra{font:500 15px "EB Garamond",serif;color:var(--brown);letter-spacing:.03em}
h1,h2{font-family:Cinzel,serif;font-weight:600;color:var(--brown);letter-spacing:.06em;line-height:1.12}
h2{font-size:clamp(26px,7.4vw,36px);margin-top:6px}
body.gu h1,body.gu h2{font-family:"Noto Serif Gujarati",serif;font-weight:700;letter-spacing:0}
body.gu h2{font-size:clamp(23px,6.4vw,30px)}
.sub{font:italic 500 19px/1.35 "Cormorant Garamond",serif;color:var(--brown);margin:10px auto 0;max-width:420px}
body.gu .sub{font:400 15px/1.7 "Noto Serif Gujarati",serif}
.lotus{display:block;width:76%;max-width:330px;height:22px;margin:16px auto}

/* hero */
.lead{font-size:16px;color:var(--muted);margin-top:4px}
.family{font:600 18px Cinzel,serif;color:var(--olive-d);letter-spacing:.05em;margin-top:4px}
body.gu .family{font:700 19px "Noto Serif Gujarati",serif;letter-spacing:0}
.couple{font-family:"Great Vibes",cursive;font-weight:400;color:var(--gold-d);font-size:clamp(52px,15vw,70px);line-height:1.05;margin-top:12px;letter-spacing:0;
  background-image:linear-gradient(180deg,#d9b866,#9c7426 45%,#e6c77a 70%,#9c7426);-webkit-background-clip:text;background-clip:text;color:transparent}
.couple{background-size:100% 220%;animation:shine 5s ease-in-out infinite}
@keyframes shine{50%{background-position:0 100%}}
.couple i{display:block;font:italic 500 21px "Cormorant Garamond",serif;color:var(--muted);-webkit-text-fill-color:var(--muted);margin:0 0 2px}
body.gu .couple{font-family:"Noto Serif Gujarati",serif;font-weight:700;font-size:clamp(32px,9vw,42px);line-height:1.35}
body.gu .couple i{font:400 16px "Noto Serif Gujarati",serif}
.bride-of{font-size:15px;color:var(--muted);margin-top:4px}
.pill{display:inline-block;position:relative;margin-top:18px;padding:9px 30px;background:linear-gradient(var(--olive),var(--olive-d));color:#fdf6e3;
  font:600 16px Cinzel,serif;letter-spacing:.12em;border:1.5px solid var(--gold);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,14px 100%,0 50%)}
body.gu .pill{font:600 15px "Noto Serif Gujarati",serif;letter-spacing:0}
.count{display:flex;justify-content:center;gap:10px;margin-top:20px}
.count div{min-width:70px;padding:8px 4px;border:1px solid var(--gold-l);border-radius:10px;background:#fffdf7}
.count b{display:block;font:600 26px Cinzel,serif;color:var(--maroon);line-height:1.1}
.count span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
body.gu .count span{text-transform:none;letter-spacing:0}

/* schedule — everything centred */
.day{padding:6px 0 18px;text-align:center}
.day + .day{border-top:1px solid var(--gold-l);padding-top:22px}
.day .pill{margin:0 0 6px;font-size:14px;letter-spacing:.1em}
body.gu .day .pill{font-size:14px}
.ev{display:flex;flex-direction:column;align-items:center;padding:10px 6px 4px}
.ev .ic{width:74px;height:60px;object-fit:contain;margin-bottom:2px;transition:transform .4s}
.ev .ic.ring{width:64px;height:64px}
.ev:hover .ic{transform:scale(1.08) rotate(-4deg)}
.t{display:inline-block;font:600 13px Cinzel,serif;letter-spacing:.14em;color:var(--gold-d);border-top:1px solid var(--gold-l);border-bottom:1px solid var(--gold-l);padding:2px 12px;margin:2px 0 6px}
body.gu .t{font:700 13px "Noto Serif Gujarati",serif;letter-spacing:0}
.n{font:600 24px/1.15 "EB Garamond",serif;color:var(--maroon)}
body.gu .n{font:700 19px/1.5 "Noto Serif Gujarati",serif}
.s{font:italic 500 17px "Cormorant Garamond",serif;color:var(--brown)}
body.gu .s{font:400 14px "Noto Serif Gujarati",serif}
.where{display:inline-flex;justify-content:center;gap:5px;margin-top:6px;font-size:15px;color:var(--ink);text-decoration:none;line-height:1.4;max-width:330px;text-align:center}
body.gu .where{font-size:13.5px}
.where svg{flex:none;width:13px;height:13px;margin-top:4px;fill:var(--gold-d)}
.where u{text-decoration:none;border-bottom:1px dotted var(--gold-d)}
.cal{display:inline-block;margin-top:8px;font:600 12px "EB Garamond",serif;letter-spacing:.06em;color:var(--olive);text-decoration:none;border:1px solid #cdd5b5;border-radius:99px;padding:3px 12px;background:#f7f8ee}
body.gu .cal{font:500 11.5px "Noto Serif Gujarati",serif;letter-spacing:0}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 2px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.dots i:nth-child(2){width:6px;height:6px;margin-top:-1px}
.same{margin-top:10px}
.same .where{font-size:15.5px}
.hosts{font:600 21px/1.3 "EB Garamond",serif;color:var(--olive-d);margin-top:4px}
.hosts b{display:block;font:500 22px "Cormorant Garamond",serif;color:var(--olive)}
body.gu .hosts{font:700 18px/1.5 "Noto Serif Gujarati",serif}
.when-box{display:flex;gap:14px;align-items:center;justify-content:center;margin:18px auto 4px;padding:12px 18px;border:1.5px solid var(--gold);border-radius:14px;max-width:380px;background:#fffdf7}
.when-box svg{width:30px;height:30px;fill:none;stroke:var(--gold-d);stroke-width:1.6;flex:none}
.when-box div{border-left:1px solid var(--gold-l);padding-left:14px;font:600 19px/1.3 "EB Garamond",serif;color:var(--brown);text-align:left}
body.gu .when-box div{font:700 15px/1.6 "Noto Serif Gujarati",serif}
.venue-c{margin-top:14px}
.venue-c .where{justify-content:center;font-size:16px}

/* tahuko */
.tahuko-h{display:flex;align-items:center;justify-content:center;gap:6px}
.tahuko-h img{width:84px}
.tahuko-h img{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.tahuko-h img.r{transform:scaleX(-1);animation-name:bobr;animation-delay:-1.3s}
@keyframes bob{50%{transform:rotate(-6deg) translateY(-3px)}}
@keyframes bobr{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) rotate(-6deg) translateY(-3px)}}
.wedo{animation:pop 1.8s ease-in-out infinite}
@keyframes pop{50%{transform:scale(1.08)}}
.tag{display:inline-block;padding:5px 20px;background:linear-gradient(var(--olive),var(--olive-d));color:#fdf6e3;font:600 18px "EB Garamond",serif;
  border:1.5px solid var(--gold);border-radius:10px}
body.gu .tag{font:700 16px "Noto Serif Gujarati",serif}
.tk1{font:italic 600 clamp(28px,8vw,36px)/1.1 "Cormorant Garamond",serif;color:var(--maroon);margin-top:14px}
body.gu .tk1{font:700 22px/1.5 "Noto Serif Gujarati",serif}
.tk2{font-size:17px;color:var(--brown);margin-top:4px}
.wedo{display:inline-block;margin:14px 0 6px;padding:4px 28px;font:italic 700 34px "Cormorant Garamond",serif;color:var(--maroon);
  background:radial-gradient(ellipse,#fbe08a 0,#f5d46d 55%,rgba(245,212,109,0) 72%)}
body.gu .wedo{font:700 26px "Noto Serif Gujarati",serif}
.tk3{font:italic 600 21px/1.3 "Cormorant Garamond",serif;color:var(--maroon)}
body.gu .tk3{font:500 16px/1.6 "Noto Serif Gujarati",serif}
.from{margin:18px auto 0;padding:10px 18px;border:1.5px solid var(--gold-l);border-radius:14px;background:linear-gradient(#fffaf0,#f8edd4);max-width:330px}
.from i{font:italic 500 15px "Cormorant Garamond",serif;color:var(--brown)}
.from b{display:block;font:400 32px "Great Vibes",cursive;color:var(--maroon);line-height:1.2}
body.gu .from i{font:400 13px "Noto Serif Gujarati",serif}
body.gu .from b{font:700 20px/1.6 "Noto Serif Gujarati",serif}

/* rsvp */
form{text-align:left;margin-top:8px}
label{display:block;font-weight:600;font-size:16px;color:var(--brown);margin:14px 0 5px}
input[type=text],input[type=tel],input[type=number],textarea{width:100%;padding:11px 13px;border:1px solid var(--gold-l);border-radius:10px;background:#fff;font:inherit;font-size:17px;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--gold-l);border-color:var(--gold)}
.choice{display:flex;gap:10px}
.choice label,.checks label{flex:1;margin:0;font-weight:500;border:1px solid var(--gold-l);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;cursor:pointer;background:#fff;font-size:15.5px}
.checks{display:grid;gap:8px}
.choice input,.checks input{accent-color:var(--olive);width:18px;height:18px;flex:none}
button.go{margin-top:22px;width:100%;padding:14px;border:1.5px solid var(--gold);border-radius:99px;background:linear-gradient(var(--olive),var(--olive-d));color:#fdf6e3;
  font:600 16px Cinzel,serif;letter-spacing:.16em;cursor:pointer;box-shadow:0 6px 18px rgba(63,79,31,.25)}
body.gu button.go{font:700 16px "Noto Serif Gujarati",serif;letter-spacing:0}
button.go:disabled{opacity:.6}
.wa{display:block;text-align:center;margin-top:12px;color:var(--olive);font-size:16px}
.done{text-align:center;padding:20px 0}
.done b{display:block;font:400 44px "Great Vibes",cursive;color:var(--gold-d)}
body.gu .done b{font:700 26px "Noto Serif Gujarati",serif}
.err{color:var(--maroon);font-size:15px;margin-top:10px;text-align:center}
footer{text-align:center;padding:4px 0 60px;color:var(--muted);font-size:15px}
footer .sig{font:400 44px "Great Vibes",cursive;color:var(--gold-d);margin-top:4px}
.hidden{display:none!important}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}
#petals{position:fixed;inset:0;pointer-events:none;z-index:15}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.bells,.open,.music.on svg,.couple,.tahuko-h img,.wedo,.cover .g{animation:none}#petals{display:none}}
@media (max-width:400px){.n{font-size:22px}.arch{padding-left:12px;padding-right:12px}.bottom-art{margin-left:-12px;margin-right:-12px;width:calc(100% + 24px)}}
</style>
</head>
<body class="locked">

<!-- cover: the tap that opens the invite also starts the music -->
<div class="cover" id="cover">
  <div class="door l"><img class="c-corner" src="img3/corner.webp" alt=""><img class="c-corner b" src="img3/corner.webp" alt=""></div>
  <div class="door r"><img class="c-corner r" src="img3/corner.webp" alt=""><img class="c-corner b r" src="img3/corner.webp" alt=""></div>
  <div class="c-in">
    <img class="g" src="img3/ganesha.webp" alt="Shree Ganesh">
    <div class="mantra" data-i="mantra"></div>
    <div class="names" style="margin-top:14px">Mehul<i>&amp;</i>Surbhi</div>
    <div class="when">29 · 01 · 2027 — 02 · 02 · 2027</div>
    <button class="open" id="open" data-i="open"></button>
  </div>
</div>

<div class="ctrl">
  <button class="music hidden" id="music" aria-label="Music on/off">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
  </button>
  <div class="lang" role="group" aria-label="Language"><button data-l="en" class="on">English</button><button data-l="gu">ગુજરાતી</button></div>
</div>
<audio id="audio" loop preload="none"></audio>
<canvas id="petals"></canvas>

<main class="wrap">
  <!-- hero -->
  <section class="card rv">
    <img class="corner" src="img3/corner.webp" alt=""><img class="corner r" src="img3/corner.webp" alt="">
    <img class="corner b" src="img3/cornerb.webp" alt=""><img class="corner b r" src="img3/cornerb.webp" alt="">
    <div class="arch">
      <img class="bells l" src="img3/bell.webp" alt=""><img class="bells r" src="img3/bell.webp" alt="">
      <img class="top-art" src="img3/ganesha.webp" alt="Shree Ganesh">
      <div class="mantra" data-i="mantra"></div>
      <svg class="lotus" data-lotus></svg>
      <p class="lead" data-i="lead"></p>
      <p class="family" data-i="family"></p>
      <p class="lead" data-i="invites"></p>
      <h1 class="couple"><span data-i="groom"></span><i data-i="with"></i><span data-i="bride"></span></h1>
      <p class="bride-of" data-i="brideOf"></p>
      <div class="pill" data-i="dates"></div>
      <div class="count" id="count"></div>
      <div style="height:40px"></div>
    </div>
  </section>

  <div id="cards"></div>

  <!-- tahuko -->
  <section class="card rv">
    <img class="corner b" src="img3/cornerb.webp" alt=""><img class="corner b r" src="img3/cornerb.webp" alt="">
    <div class="arch" style="padding-top:44px">
      <div class="tahuko-h"><img src="img3/peacock.webp" alt=""><span class="tag" data-i="tahuko"></span><img class="r" src="img3/peacock.webp" alt=""></div>
      <p class="tk1" data-i="tk1"></p>
      <p class="tk2" data-i="tk2"></p>
      <span class="wedo" data-i="wedo"></span>
      <p class="tk3" data-i="tk3"></p>
      <div class="from"><i data-i="tkFrom"></i><b data-i="tkKids"></b></div>
      <div style="height:46px"></div>
    </div>
  </section>

  <!-- rsvp -->
  <section class="card rv" id="rsvp">
    <div class="arch" style="padding-top:40px">
      <img class="top-art sm" src="img3/kalash.webp" alt="" style="margin-top:-8px;max-width:120px">
      <h2 data-i="rsvpH"></h2>
      <p class="sub" id="rsvpBy"></p>
      <svg class="lotus" data-lotus></svg>
      <form id="form" novalidate>
        <label for="f-name" data-i="fName"></label>
        <input id="f-name" name="name" type="text" required autocomplete="name">
        <label for="f-phone" data-i="fPhone"></label>
        <input id="f-phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel">
        <label data-i="fAttend"></label>
        <div class="choice">
          <label><input type="radio" name="attending" value="Yes" checked><span data-i="yes"></span></label>
          <label><input type="radio" name="attending" value="No"><span data-i="no"></span></label>
        </div>
        <div id="yesOnly">
          <label for="f-count" data-i="fCount"></label>
          <input id="f-count" name="guests" type="number" min="1" max="30" value="2">
          <label data-i="fEvents"></label>
          <div class="checks" id="checks"></div>
        </div>
        <label for="f-msg" data-i="fMsg"></label>
        <textarea id="f-msg" name="message" rows="3"></textarea>
        <button class="go" type="submit" data-i="send"></button>
        <p class="err hidden" id="err"></p>
      </form>
      <div class="done hidden" id="done"><b data-i="thanks"></b><span data-i="thanksSub"></span></div>
      <a class="wa hidden" id="wa" target="_blank" rel="noopener" data-i="wa"></a>
    </div>
  </section>
</main>

const where = p => `<a class="where" href="${MAP(PLACES[p].q)}" target="_blank" rel="noopener">${PIN}<span><u>${esc(PLACES[p][lang])}</u></span></a>`;

const CALT = {en:"Add to calendar", gu:"કૅલેન્ડરમાં ઉમેરો"};
function cal(at, title, p){
  if (!at) return "";
  const s = new Date(at + ":00+05:30"), e = new Date(s.getTime() + 2*36e5);
  const f = x => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mehul-Surbhi//EN","BEGIN:VEVENT","UID:" + f(s) + "@mehul-surbhi",
    "DTSTAMP:" + f(new Date()),"DTSTART:" + f(s),"DTEND:" + f(e),"SUMMARY:" + title + " – Mehul & Surbhi","LOCATION:" + PLACES[p].en.replace(/,/g, "\\,"),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  return `<a class="cal" download="${title.replace(/[^A-Za-z]+/g, "-")}.ics" href="data:text/calendar;charset=utf-8,${encodeURIComponent(ics)}">＋ ${CALT[lang]}</a>`;
}

function renderCards(){
  const L = lang;
  document.getElementById("cards").innerHTML = invited.map(k => {
    const e = EVENTS[k];
    let body = "";
    if (e.hosts) {
      body += `<p class="hosts">${esc(e.hosts[L][0])}<b>&amp;</b>${esc(e.hosts[L][1])}</p>
        <p class="sub" style="font-style:normal">${esc(e.invite[L])}</p>
        <div class="when-box">${CAL}<div>${esc(e.when[L][0])}<br>${esc(e.when[L][1])}</div></div>
        <div class="venue-c">${where(e.venue)}</div>${cal(e.at, "Wedding Vows Renewal", e.venue)}`;
    }
    if (e.couple) body += `<p class="couple" style="font-size:clamp(44px,12vw,58px)"><span>${esc(T[L].groom)}</span><i>${esc(T[L].with)}</i><span>${esc(T[L].bride)}</span></p><p class="bride-of">${esc(T[L].brideOf)}</p><svg class="lotus" data-lotus></svg>`;
    if (e.days) body += e.days.map(d => {
        const one = d.items.length > 1 && d.items.every(i => i.p === d.items[0].p);
        return `<div class="day"><div class="pill">${esc(DAYS[d.d][L])}</div>
        ${d.items.map((i, n) => `${n ? '<div class="dots"><i></i><i></i><i></i></div>' : ""}<div class="ev">
          ${i.ic ? `<img class="ic${i.ring ? " ring" : ""}" src="img3/${i.ic}.webp" alt="">` : ""}
          <div class="t">${esc(i.t[L])}</div>
          <div class="n">${esc(i.n[L])}</div>${i.s ? `<div class="s">${esc(i.s[L])}</div>` : ""}
          ${one ? "" : where(i.p)}
          ${cal(i.at, i.n.en, i.p)}</div>`).join("")}
        ${one ? `<div class="same">${where(d.items[0].p)}</div>` : ""}</div>`; }).join("");
    const top = e.top ? `<img class="top-art${e.topSm ? " sm" : ""}" src="${"img3/" + e.top + ".webp"}" alt="">` : "";
    const bottom = e.bottom ? `<img class="bottom-art" src="${"img3/" + e.bottom + ".webp"}" alt="">` : `<div style="height:30px"></div>`;
    return `<section class="card rv">
      ${e.corners ? `<img class="corner" src="img3/corner.webp" alt=""><img class="corner r" src="img3/corner.webp" alt="">` : ""}
      ${e.corners && !e.bottom ? `<img class="corner b" src="img3/cornerb.webp" alt=""><img class="corner b r" src="img3/cornerb.webp" alt="">` : ""}
      <div class="arch" ${e.top ? "" : 'style="padding-top:70px"'}>
        ${top}
        <h2>${esc(e.title[L])}</h2>
        ${e.sub ? `<p class="sub">${esc(e.sub[L])}</p>` : ""}
        <svg class="lotus" data-lotus></svg>
        ${body}
        ${bottom}
      </div></section>`;
  }).join("");
  document.getElementById("checks").innerHTML = invited.map(k => {
    const e = EVENTS[k], name = e.name || e.title;
    return `<label><input type="checkbox" name="events" value="${esc(name.en)}" checked><span>${esc(name[L])}</span></label>`; }).join("");
  document.querySelectorAll("[data-lotus]").forEach(s => s.outerHTML = LOTUS.replace("<svg ", '<svg class="lotus" '));
  reveal();
}

function renderText(){
  document.body.classList.toggle("gu", lang === "gu");
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => { const v = T[lang][el.dataset.i]; if (v !== undefined) el.textContent = v; });
  document.getElementById("rsvpBy").textContent = RSVP_BY[lang];
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  renderCards(); tick(); setWa();
}

function tick(){
  const ms = WEDDING - Date.now(), c = document.getElementById("count");
  if (ms <= 0) { c.innerHTML = ""; return; }
  const d = Math.floor(ms/864e5), h = Math.floor(ms/36e5)%24, m = Math.floor(ms/6e4)%60;
  c.innerHTML = [[d,"d"],[h,"h"],[m,"m"]].map(([v,k]) => `<div><b>${v}</b><span>${T[lang][k]}</span></div>`).join("");
}
setInterval(tick, 30000);

let io;
function reveal(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if (!("IntersectionObserver" in window) || params.has("static")) { els.forEach(e => e.classList.add("in")); return; }
  io = io || new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .08 });
  els.forEach(e => io.observe(e));
}

function setWa(){
  const a = document.getElementById("wa");
  if (!RSVP_WHATSAPP) { a.classList.add("hidden"); return; }
  a.classList.remove("hidden");
  a.href = `https://wa.me/${RSVP_WHATSAPP}?text=` + encodeURIComponent("RSVP – Mehul & Surbhi wedding: ");
}

/* ---- music: browsers only allow sound after a tap, so the cover's button starts it ---- */
const audio = document.getElementById("audio"), mBtn = document.getElementById("music");
let hasMusic = false;
fetch(MUSIC_FILE, { method: "HEAD" }).then(r => { if (r.ok) { hasMusic = true; audio.src = MUSIC_FILE; mBtn.classList.remove("hidden"); } }).catch(() => {});
function play(){ if (!hasMusic) return; audio.volume = .55; audio.play().then(() => mBtn.classList.add("on")).catch(() => {}); }
mBtn.onclick = () => { if (audio.paused) play(); else { audio.pause(); mBtn.classList.remove("on"); } };
document.addEventListener("visibilitychange", () => { if (document.hidden && !audio.paused) { audio.pause(); audio.dataset.resume = 1; }
  else if (!document.hidden && audio.dataset.resume) { delete audio.dataset.resume; play(); } });

/* ---- falling marigold & rose petals, plus a burst on open and on RSVP ---- */
const cv = document.getElementById("petals"), cx = cv.getContext("2d");
const COLS = ["#f59e0b","#f97316","#fbbf24","#e11d48","#f472b6","#ffffff","#d4a843"];
let P = [], dpr = Math.min(2, window.devicePixelRatio || 1), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){ cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; }
size(); addEventListener("resize", size);
const petal = (burst) => ({ x: burst ? innerWidth/2 + (Math.random()-.5)*60 : Math.random()*innerWidth, y: burst ? innerHeight*.45 : -20,
  vx: burst ? (Math.random()-.5)*9 : (Math.random()-.5)*.6, vy: burst ? -Math.random()*9-3 : Math.random()*.7+.5,
  r: Math.random()*5+4, a: Math.random()*6.28, va: (Math.random()-.5)*.08, c: COLS[Math.random()*COLS.length|0], w: Math.random()*6.28, burst });
function burst(n){ if (!still) for (let i=0;i<n;i++) P.push(petal(true)); }
let last = 0;
function frame(t){
  if (!still && P.filter(p => !p.burst).length < 16 && t - last > 700) { P.push(petal(false)); last = t; }
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
  P = P.filter(p => p.y < innerHeight + 30);
  for (const p of P) {
    if (p.burst) { p.vy += .22; p.vx *= .985; } else { p.w += .02; p.vx = Math.sin(p.w)*.6; }
    p.x += p.vx; p.y += p.vy; p.a += p.va;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.scale(1, Math.abs(Math.sin(p.a*1.3))*.6+.4);
    cx.fillStyle = p.c; cx.globalAlpha = .85; cx.beginPath(); cx.ellipse(0,0,p.r,p.r*.55,0,0,6.28); cx.fill();
    cx.globalAlpha = .25; cx.fillStyle = "#7a3b00"; cx.beginPath(); cx.ellipse(-p.r*.2,0,p.r*.5,p.r*.12,0,0,6.28); cx.fill(); cx.restore();
  }
  requestAnimationFrame(frame);
}
if (!still) requestAnimationFrame(frame);

document.getElementById("open").onclick = () => {
  document.getElementById("cover").classList.add("gone"); document.body.classList.remove("locked"); play(); reveal();
  setTimeout(() => burst(90), 500);
};
if (params.has("open")) document.getElementById("open").click();

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch(e){} renderText();
});
document.querySelectorAll("input[name=attending]").forEach(r => r.onchange = () =>
  document.getElementById("yesOnly").classList.toggle("hidden", r.value === "No" && r.checked));

document.getElementById("form").onsubmit = async ev => {
  ev.preventDefault();
  const f = ev.target, err = document.getElementById("err"), btn = f.querySelector("button");
  const data = {
    name: f.elements["name"].value.trim(), phone: f.elements["phone"].value.trim(),
    attending: f.elements["attending"].value, guests: f.elements["attending"].value === "Yes" ? f.elements["guests"].value : "0",
    events: [...f.querySelectorAll("input[name=events]:checked")].map(x => x.value).join(", "),
    message: f.elements["message"].value.trim(), invite: invited.join(""), lang
  };
  err.classList.add("hidden");
  if (!data.name || !data.phone) { err.textContent = T[lang].need; err.classList.remove("hidden"); return; }
  btn.disabled = true; btn.textContent = T[lang].sending;
  try {
    if (!RSVP_ENDPOINT) throw new Error("no endpoint");
    await fetch(RSVP_ENDPOINT, { method:"POST", mode:"no-cors", body: new URLSearchParams(data) });
    f.classList.add("hidden"); document.getElementById("done").classList.remove("hidden"); burst(120);
  } catch (e) {
    err.textContent = T[lang].fail; err.classList.remove("hidden");
    btn.disabled = false; btn.textContent = T[lang].send;
  }
};

renderText();
</script>
